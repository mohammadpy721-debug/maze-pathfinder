<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maze Pathfinder</title>
<style>
  :root { --bg:#f8fafc; --fg:#0f172a; --wall:#1e293b; --cell:#ffffff; --visit:#c4b5fd; --path:#f59e0b; --start:#22c55e; --end:#ef4444; --accent:#9333ea; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0d1117; --fg:#e2e8f0; --wall:#020617; --cell:#1e293b; --visit:#7c3aed; --path:#fbbf24; } }
  :root[data-theme="dark"] { --bg:#0d1117; --fg:#e2e8f0; --wall:#020617; --cell:#1e293b; --visit:#7c3aed; --path:#fbbf24; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:system-ui,sans-serif; display:flex; flex-direction:column; align-items:center; gap:16px; padding:24px 16px; }
  h1 { margin:0; font-size:1.6rem; color:var(--accent); }
  .controls { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; align-items:center; }
  button, select, input { font:inherit; padding:8px 12px; border-radius:8px; border:1px solid var(--accent); background:transparent; color:var(--fg); cursor:pointer; }
  button:hover { background:var(--accent); color:#fff; }
  #grid { display:grid; gap:1px; background:var(--wall); border:2px solid var(--wall); max-width:100%; }
  .c { width:var(--s,16px); height:var(--s,16px); background:var(--cell); }
  .wall { background:var(--wall); } .visit { background:var(--visit); } .path { background:var(--path); } .start { background:var(--start); } .end { background:var(--end); }
  #stats { font-size:.95rem; opacity:.85; min-height:1.4em; text-align:center; }
  .toggle { border:none; }
</style>
</head>
<body>
<h1>🧩 Maze Pathfinder</h1>
<div class="controls">
  <label>Size <input id="size" type="range" min="10" max="45" value="25"><span id="sizeVal">25</span></label>
  <select id="algo">
    <option value="bfs">BFS</option>
    <option value="astar">A*</option>
  </select>
  <button id="gen">New maze</button>
  <button id="solve">Solve</button>
  <button id="theme" class="toggle">🌓 Theme</button>
</div>
<div id="stats"></div>
<div id="grid"></div>

<script>
(() => {
  const gridEl = document.getElementById('grid');
  const sizeEl = document.getElementById('size');
  const sizeVal = document.getElementById('sizeVal');
  const algoEl = document.getElementById('algo');
  const stats = document.getElementById('stats');
  let N = 25, maze, cells, start, end, busy = false, token = 0;

  // Recursive backtracker: carve a perfect maze on odd coordinates.
  function generate(n) {
    const size = n * 2 + 1;
    const g = Array.from({ length: size }, () => Array(size).fill(1));
    const stack = [[1, 1]];
    g[1][1] = 0;
    const dirs = [[0,2],[2,0],[0,-2],[-2,0]];
    while (stack.length) {
      const [r, c] = stack[stack.length - 1];
      const opts = dirs.map(([dr, dc]) => [r + dr, c + dc, dr, dc])
        .filter(([nr, nc]) => nr > 0 && nc > 0 && nr < size - 1 && nc < size - 1 && g[nr][nc] === 1);
      if (!opts.length) { stack.pop(); continue; }
      const [nr, nc, dr, dc] = opts[Math.floor(Math.random() * opts.length)];
      g[r + dr / 2][c + dc / 2] = 0;
      g[nr][nc] = 0;
      stack.push([nr, nc]);
    }
    return g;
  }

  function neighbors(r, c, g) {
    const out = [];
    for (const [dr, dc] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nr = r + dr, nc = c + dc;
      if (nr >= 0 && nc >= 0 && nr < g.length && nc < g[0].length && g[nr][nc] === 0) out.push([nr, nc]);
    }
    return out;
  }

  function draw() {
    const size = maze.length;
    gridEl.style.gridTemplateColumns = `repeat(${size}, var(--s))`;
    const px = Math.max(8, Math.min(18, Math.floor(560 / size)));
    gridEl.style.setProperty('--s', px + 'px');
    gridEl.innerHTML = '';
    cells = [];
    for (let r = 0; r < size; r++) {
      cells[r] = [];
      for (let c = 0; c < size; c++) {
        const d = document.createElement('div');
        d.className = 'c' + (maze[r][c] ? ' wall' : '');
        gridEl.appendChild(d);
        cells[r][c] = d;
      }
    }
    cells[start[0]][start[1]].classList.add('start');
    cells[end[0]][end[1]].classList.add('end');
  }

  function newMaze() {
    token++;
    busy = false;
    N = +sizeEl.value;
    maze = generate(N);
    const size = maze.length;
    start = [1, 1];
    end = [size - 2, size - 2];
    draw();
    stats.textContent = 'New maze ready. Press Solve.';
  }

  const sleep = ms => new Promise(res => setTimeout(res, ms));

  function heuristic(a, b) { return Math.abs(a[0] - b[0]) + Math.abs(a[1] - b[1]); }

  // Generic search: BFS when h is null, A* otherwise. Returns visit order and path.
  function search(useAstar) {
    const size = maze.length;
    const key = (r, c) => r * size + c;
    const prev = new Map();
    const gScore = new Map([[key(...start), 0]]);
    const visitedOrder = [];
    const open = [{ pos: start, f: 0 }];
    const closed = new Set();
    while (open.length) {
      let idx = 0;
      if (useAstar) {
        for (let i = 1; i < open.length; i++) if (open[i].f < open[idx].f) idx = i;
      }
      const cur = open.splice(useAstar ? idx : 0, 1)[0].pos;
      const k = key(...cur);
      if (closed.has(k)) continue;
      closed.add(k);
      visitedOrder.push(cur);
      if (cur[0] === end[0] && cur[1] === end[1]) break;
      for (const nb of neighbors(cur[0], cur[1], maze)) {
        const nk = key(...nb);
        const g = gScore.get(k) + 1;
        if (!gScore.has(nk) || g < gScore.get(nk)) {
          gScore.set(nk, g);
          prev.set(nk, cur);
          open.push({ pos: nb, f: useAstar ? g + heuristic(nb, end) : 0 });
        }
      }
    }
    const path = [];
    let p = end;
    if (prev.has(key(...end)) || (end[0] === start[0] && end[1] === start[1])) {
      while (p) { path.unshift(p); p = prev.get(key(...p)); }
    }
    return { visitedOrder, path, found: path.length > 0 && path[0][0] === start[0] && path[0][1] === start[1] };
  }

  async function solve() {
    if (busy) return;
    busy = true;
    const my = ++token;
    draw();
    const useAstar = algoEl.value === 'astar';
    const t0 = performance.now();
    const { visitedOrder, path, found } = search(useAstar);
    const ms = (performance.now() - t0).toFixed(2);
    const delay = Math.max(2, Math.min(20, Math.floor(1500 / visitedOrder.length)));
    for (const [r, c] of visitedOrder) {
      if (my !== token) return;
      if (!(r === start[0] && c === start[1]) && !(r === end[0] && c === end[1])) cells[r][c].classList.add('visit');
      if (delay > 0) await sleep(delay);
    }
    for (const [r, c] of path) {
      if (my !== token) return;
      if (!(r === start[0] && c === start[1]) && !(r === end[0] && c === end[1])) cells[r][c].classList.add('path');
      await sleep(12);
    }
    stats.textContent = found
      ? `${useAstar ? 'A*' : 'BFS'} · path length ${path.length - 1} · explored ${visitedOrder.length} cells · ${ms} ms`
      : 'No path found.';
    busy = false;
  }

  sizeEl.addEventListener('input', () => { sizeVal.textContent = sizeEl.value; });
  sizeEl.addEventListener('change', newMaze);
  document.getElementById('gen').addEventListener('click', newMaze);
  document.getElementById('solve').addEventListener('click', solve);
  document.getElementById('theme').addEventListener('click', () => {
    const root = document.documentElement;
    const dark = root.dataset.theme === 'dark' || (!root.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
    root.dataset.theme = dark ? 'light' : 'dark';
  });
  newMaze();
})();
</script>
</body>
</html>
